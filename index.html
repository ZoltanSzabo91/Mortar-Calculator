<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mortar calculator</title>
        <link rel="stylesheet" href="css/layout.css">
    </head>
    <body>
        <section class="header">
            <h1>Tűzvezetési számítások</h1>
            <div id="hamb" class="hamb">
                <hr><hr><hr>
            </div>
            <div class="hambPanel hidden">
                
                <button class="hambBtn">Tűzvezetés</button>
                <button class="hambBtn">Astronómia</button>
                <button class="hambBtn" id="beallit">Beállítások</button>
            </div>
            <div class="beallitasok hidden">
                <div style="display: flex; flex-direction: row; align-items: center;"> 
                    <p style="font-size: 12px; padding: 0 12px; color: var(--text-primary);">DarkMode</p>
                    <div class="dm-out"><div class="dm-in"></div></div>
                </div>
                <button class="hambBtn" id="MilVonas">Vonás 6400</button>
            </div>
        </section>
        <main class="content">
            <section>
                <h3>Figyelőpont</h3>
                <hr>
                <form>
                    <div class="poi">
                        <label for="zone1">Zóna</label>
                        <input id="zone1" type="text" maxlength="3" minlength="3" required placeholder="34t">
                    </div>
                    <div class="poi">
                        <label for="square1">Négyzet</label>
                        <input id="square1" type="text" maxlength="2" minlength="2" required placeholder="ds">
                    </div>
                    <div class="poi">
                        <label for="east1">X</label>
                        <input id="east1" type="text" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" required placeholder="00000">
                    </div>
                    <div class="poi">
                        <label for="north1">Y</label>
                        <input id="north1" type="text" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" required placeholder="00000">
                    </div>
                </form>                
            </section>

            <section>
                <h3>Tüzelőállás</h3>
                <hr>
                <form>
                    <div class="poi">
                        <label for="zone2">Zóna</label>
                        <input id="zone2" type="text" maxlength="3" minlength="3" required placeholder="34t">
                    </div>
                    <div class="poi">
                        <label for="square2">Négyzet</label>
                        <input id="square2" type="text" maxlength="2" minlength="2" required placeholder="ds">
                    </div>
                    <div class="poi">
                        <label for="east2">X</label>
                        <input id="east2" type="text" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" required placeholder="00000">
                    </div>
                    <div class="poi">
                        <label for="north2">Y</label>
                        <input id="north2" type="text" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" required placeholder="00000">
                    </div>
                </form>                
            </section>

            <section>
                <h3>Cél a figyelőpontból</h3>
                <hr>
                <div class="poi">
                    <label for="deltaAm">Delta Am</label>
                    <input style="margin-bottom: 4px;" type="number" id="deltaAm" required placeholder="0">
                </div>
                <form>
                    <div class="poi">
                        <label for="tav">Távolság m-ben</label>
                        <input id="tav" name="tav" type="number" required>
                    </div>
                    <div class="poi">
                        <label for="irany" id="iranyLabel">Irányszög</label>
                        <input type="number" name="irany" id="irany" required>
                    </div>
                </form>
                <div class="celkoordinata">
                    <p>Cél Koordináta</p>
                    <p id="zoneTarget"></p>
                    <p id="squareTarget"></p>
                    <p id="targetX"></p>
                    <p id="targetY"></p>
                </div>
                <button class="btn" id="calculate" disabled>Számítás</button>
            </section>

            <section class="eredmenyek">
                <h3>Eredmények</h3>
                <hr>
                <div class="er-sor">
                    <h4>Irányszög</h4>
                    <p id="resultIrany">0</p>
                </div>
                <hr>
                <div class="er-sor">
                    <h4>Távolság</h4>
                    <p id="resultTav">0</p>
                </div>
                <hr>
                <div class="er-sor">
                    <h4>Jav. töltet</h4>
                    <p id="resultToltes">0</p>
                </div>
                <hr>
            </section>
        </main>
        <script src="js/config.js"></script>
        <script src="js/ui.js"></script>
        <script src="js/calculator.js"></script>
    </body>
</html>
